name: Architecture Check

on:
  push:
  pull_request:

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.22"
          python-version-file: ".python-version"

      - name: Install the project from uv.lock
        run: uv sync --locked

      - name: Run the Architecture Check (tach)
        run: uv run tach check

      - name: Run the import-cycle check
        run: uv run python scripts/check_cycles.py
